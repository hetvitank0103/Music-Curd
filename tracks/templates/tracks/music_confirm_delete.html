<!-- tracks/templates/tracks/music_confirm_delete.html -->
{% extends 'tracks/base.html' %}

{% block title %}Delete Track - Opus Collection{% endblock %}

{% block content %}
<div style="max-width: 500px; margin: 0 auto; text-align: center;">
    <div class="glass-card" style="border-color: rgba(255, 50, 50, 0.4);">
        
        <h2 style="color: #ffb3b3; margin-bottom: 20px;">Delete Masterpiece?</h2>
        
        <p style="font-size: 1.1rem; margin-bottom: 30px;">
            Are you absolutely sure you want to permanently delete <br>
            <strong style="color: var(--gold-accent); font-size: 1.3rem;">"{{ object.title }}"</strong> <br>
            by {{ object.artist }}?
        </p>

        <!-- The form MUST be a POST request to actually delete the file from the database -->
        <form method="POST">
            {% csrf_token %}
            
            <div style="display: flex; justify-content: center; gap: 20px; margin-top: 30px;">
                <a href="{% url 'music_list' %}" class="btn" style="background: transparent; border-color: rgba(255,255,255,0.3); color: #ccc;">
                    No, Take Me Back
                </a>
                
                <button type="submit" class="btn" style="background: rgba(255, 50, 50, 0.15); border-color: rgba(255, 50, 50, 0.5); color: #ffb3b3;">
                    Yes, Delete It
                </button>
            </div>
        </form>
        
    </div>
</div>
{% endblock %}
