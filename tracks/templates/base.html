<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Royal Audio Library{% endblock %}</title>
    
    <!-- Importing Classic & Elegant Fonts -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,600&family=Poppins:wght@300;400;500&display=swap');

        :root {
            --deep-violet: #130321;
            --royal-purple: #2D0A4E;
            --light-purple: #4A1578;
            --gold-accent: #D4AF37;
            --text-light: #F8F5FA;
            --glass-bg: rgba(45, 10, 78, 0.45);
            --glass-border: rgba(212, 175, 55, 0.25);
        }

        /* Animated Violet Background */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            color: var(--text-light);
            background: linear-gradient(-45deg, var(--deep-violet), var(--royal-purple), #1E0735, var(--light-purple));
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Classic Typography */
        h1, h2, h3 {
            font-family: 'Playfair Display', serif;
            color: var(--gold-accent);
            letter-spacing: 1px;
        }

        /* Sleek Navigation Bar */
        nav {
            width: 100%;
            padding: 20px 0;
            background: rgba(19, 3, 33, 0.7);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(12px);
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            justify-content: center;
            gap: 40px;
            border-bottom: 1px solid var(--glass-border);
        }

        nav a {
            color: var(--text-light);
            text-decoration: none;
            font-size: 1.1rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.4s ease;
        }

        nav a.brand {
            font-family: 'Playfair Display', serif;
            color: var(--gold-accent);
            font-size: 1.4rem;
        }

        nav a:hover {
            color: var(--gold-accent);
            text-shadow: 0 0 15px rgba(212, 175, 55, 0.5);
            transform: translateY(-2px);
        }

        /* Main Content Area with Fade-In */
        .container {
            width: 90%;
            max-width: 1000px;
            margin: 50px auto;
            animation: fadeIn 1.2s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Glassmorphism Cards */
        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 35px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            transition: all 0.4s ease;
        }
        
        .glass-card:hover {
            transform: translateY(-5px);
            border-color: rgba(212, 175, 55, 0.6);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.7);
        }

        /* Royal Buttons */
        .btn {
            background: linear-gradient(135deg, var(--light-purple), var(--royal-purple));
            color: var(--gold-accent);
            border: 1px solid var(--gold-accent);
            padding: 12px 30px;
            border-radius: 30px;
            font-family: 'Poppins', sans-serif;
            font-weight: 500;
            letter-spacing: 1.5px;
            cursor: pointer;
            text-transform: uppercase;
            text-decoration: none;
            display: inline-block;
            transition: all 0.4s ease;
        }

        .btn:hover {
            background: var(--gold-accent);
            color: var(--deep-violet);
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.6);
            transform: scale(1.05);
        }
        
        /* Audio Player Styling Override */
        audio {
            width: 100%;
            margin-top: 15px;
            border-radius: 30px;
            outline: none;
        }
    </style>
</head>
<body>
    
    <nav>
        <a href="{% url 'music_list' %}" class="brand">Opus Collection</a>
        <a href="{% url 'music_list' %}">Library</a>
        <a href="{% url 'music_create' %}">Upload</a>
    </nav>

    <div class="container">
        <!-- Everything from the other pages will get injected right here -->
        {% block content %}
        {% endblock %}
    </div>

</body>
</html>
